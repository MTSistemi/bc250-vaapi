# bc250-encoding-decoding-fix - https://github.com/simpmix/bc250-encoding-decoding-fix
# Optimized Sunshine 120 FPS Ultra-Low-Latency Configuration for AMD BC-250 APU
# Place in: ~/.config/sunshine/sunshine.conf or /etc/sunshine/sunshine.conf
#
# NOTE: This preset is tuned for high-refresh 120 FPS / 144 FPS game streaming
# to Moonlight clients with sub-5ms host processing latency.

# Hardware Encoder Configuration
encoder = vaapi
adapter_name = /dev/dri/renderD128

# Streaming & Threading Tuning for 120 FPS
min_threads = 2
fec_percentage = 10

# Low-Latency Settings
hevc_mode = 0
audio_sink = auto
back_button_timeout = 1000

# Recommended Environment for 120 FPS:
# BC250_SLICES_PER_FRAME=2   (2 slices prevents thread congestion within 8.33ms budget)
# BC250_FAST_MODE=1          (restricts GPU overhead to <3%)
# OMP_WAIT_POLICY=PASSIVE
# GOMP_SPINCOUNT=0
